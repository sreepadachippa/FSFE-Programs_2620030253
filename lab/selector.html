<html>
    <head>
        <title>Selector</title>
        <style>
            
            #para1{
                text-align: center;
                color: rgb(255,0,0);
            }
            #para2{
                text-align: center;
                color: violet;
            }
            body {
                background-color:lightyellow;
            }
            </style>
    </head>
    <body>
        <p align = "center"><b>This is a selector example of a simple HTML page with CSS styling
              (This para isn't affected by the style).</b></p>
        <p id = "para1"><i>me too</i></p>
        <p id = "para2">AND ME!!! MARIOOO</p>
    </body>
</html>
